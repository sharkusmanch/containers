# Unprivileged nginx for the static DQ8 Alchemy Planner site.
# Runs as a non-root user on a read-only root filesystem: everything nginx writes lives
# under /tmp, and the port is above 1024. The newest save is served from /run/save,
# which the latest-save watcher fills.

worker_processes 1;
daemon off;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 256;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /dev/stdout;
    server_tokens off;
    sendfile on;
    absolute_redirect off;
    autoindex off;

    # Every temp path nginx knows about, so nothing is created outside /tmp at start-up.
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    server {
        listen 8080;
        server_name _;

        root /srv/site;
        index index.html;

        # add_header in a location replaces the server-level ones, so each location
        # that sets Cache-Control repeats nosniff.

        location = /healthz {
            access_log off;
            default_type text/plain;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Cache-Control "no-store" always;
            return 200 "ok\n";
        }

        # The newest save, written by latest-save. Absent file: 404.
        location = /save {
            alias /run/save/latest.bin;
            log_not_found off;
            types { }
            default_type application/octet-stream;
            add_header Cache-Control "no-store" always;
            add_header X-Content-Type-Options "nosniff" always;
        }

        # Hashed build output: safe to cache for a year.
        location /assets/ {
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header X-Content-Type-Options "nosniff" always;
        }

        # "/" is served by the /index.html location below, so it gets the same headers.
        location = / {
            rewrite ^ /index.html last;
        }

        location = /index.html {
            add_header Cache-Control "no-cache" always;
            add_header X-Content-Type-Options "nosniff" always;
        }

        location / {
            try_files $uri =404;
            add_header Cache-Control "no-cache" always;
            add_header X-Content-Type-Options "nosniff" always;
        }
    }
}
