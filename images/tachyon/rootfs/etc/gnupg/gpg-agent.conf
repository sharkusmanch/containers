# Global gpg-agent config (read before any keyring's own gpg-agent.conf).
# Tachyon kills gpg-agent after every request; this covers a PHP worker killed
# mid-request, which skips that, so no passphrase outlives its request. The
# build tests that it takes effect. [force] stops a per-keyring config from
# re-enabling caching.
[force]
default-cache-ttl 0
max-cache-ttl 0
disable-scdaemon
