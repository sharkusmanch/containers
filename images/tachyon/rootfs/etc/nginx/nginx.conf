# Runs unprivileged (UID 10000) on a read-only root filesystem: every path nginx
# writes is under /tmp, and the error log goes to stderr. Start with
#   nginx -e stderr -g 'daemon off;'
# so the compiled-in /var/lib/nginx/logs/error.log is never opened.
worker_processes 1;
pid /tmp/nginx.pid;
error_log stderr warn;

events {
  worker_connections 256;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  access_log off;
  server_tokens off;
  sendfile on;
  tcp_nopush on;
  keepalive_timeout 15;

  client_body_temp_path /tmp/nginx-client_body;
  fastcgi_temp_path /tmp/nginx-fastcgi;
  proxy_temp_path /tmp/nginx-proxy;
  uwsgi_temp_path /tmp/nginx-uwsgi;
  scgi_temp_path /tmp/nginx-scgi;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 512;
  gzip_proxied any;
  gzip_vary on;
  gzip_types text/css text/javascript text/plain text/xml application/javascript application/json application/xml image/svg+xml;

  # Behind a reverse proxy the peer is the proxy; take the client address from
  # X-Real-IP when present (ingress-nginx sets it), else the peer.
  map $http_x_real_ip $tachyon_client_ip {
    ""      $remote_addr;
    default $http_x_real_ip;
  }

  server {
    listen 8080 default_server;
    server_name _;
    root /tachyon;
    charset utf-8;

    # Attachments. Keep in step with post_max_size (55M): a 50M upload plus
    # multipart overhead must fit.
    client_max_body_size 55m;

    add_header X-Content-Type-Options nosniff always;

    # Two unauthenticated actions with side effects: ?/Test makes the server
    # send HTTP requests to its own Host header, ?/AdminAppData can write an
    # admin password file. Neither is needed. Tachyon strips "@..." from the
    # action name and accepts an optional admin-key prefix (?admin/Test), so
    # both are matched too.
    if ($args ~* "^/*(?:[^/&]+/+)?(Test|AdminAppData)(?:[@/&]|$)") {
      return 404;
    }

    # Static assets only. Everything else under /tachyon/v/<version>/ is code
    # (app/, *.php entry points such as setup.php and imapsync.php) and is
    # never served or executed. The regex is nested because a ^~ prefix
    # location stops nginx from checking top-level regex locations.
    location ^~ /tachyon/ {
      location ~ ^/tachyon/v/[^/]+/(static|themes)/ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options nosniff always;
        add_header Service-Worker-Allowed "/";
      }
      return 404;
    }

    # Version-independent favicon (a symlink created at build time), so an
    # ingress can exempt one stable path from authentication.
    location = /favicon.ico {
      try_files $uri =404;
      expires 7d;
    }

    # The single PHP entry point. Tachyon routes on QUERY_STRING (?/Action),
    # never on the path, so every other request is the front controller.
    location = /index.php {
      include /etc/nginx/fastcgi_params;
      fastcgi_param SCRIPT_FILENAME $document_root/index.php;
      fastcgi_param SCRIPT_NAME /index.php;
      fastcgi_param REMOTE_ADDR $tachyon_client_ip;
      fastcgi_param HTTP_PROXY "";
      # TLS terminates at the ingress; tell Tachyon, so its cookies are Secure.
      fastcgi_param HTTPS on;
      fastcgi_pass 127.0.0.1:9000;
      fastcgi_read_timeout 600;
      fastcgi_request_buffering off;
      # Spool large responses (attachment downloads) to /tmp so the PHP worker
      # is released quickly instead of being held for as long as a slow client
      # takes; above this size nginx streams the rest synchronously. Keep the
      # web container's /tmp emptyDir sizeLimit well above it.
      fastcgi_max_temp_file_size 128m;
    }
    location / {
      rewrite ^ /index.php last;
    }
  }

  # Liveness endpoint for the nginx container. Not exposed through the
  # Service, so never reachable through the ingress. php-fpm is probed from
  # its own container (cgi-fcgi against its ping.path), so that a PHP hang
  # never restarts nginx and an nginx hang never restarts PHP.
  server {
    listen 8081;
    location = /healthz {
      default_type text/plain;
      return 200 "ok\n";
    }
    location / {
      return 404;
    }
  }
}
