expose_php = Off
display_errors = Off
log_errors = On
error_log = /proc/self/fd/2
date.timezone = UTC

; Tachyon makes its HTTP requests through sockets, never URL fopen. Its one
; URL-fopen caller is admin-panel domain autoconfig, which is not used.
allow_url_fopen = Off
; gpg needs proc_open and shell_exec (`which gpg`); exec stays for a homedir
; fallback in Actions/Pgp.php. Nothing uses these:
disable_functions = passthru,system,popen,pcntl_exec

memory_limit = 256M
upload_max_filesize = 50M
post_max_size = 55M
max_execution_time = 600

upload_tmp_dir = /tmp
sys_temp_dir = /tmp
session.save_path = /tmp

; Code is immutable in the image: never stat it for changes.
opcache.enable = 1
opcache.validate_timestamps = 0
opcache.memory_consumption = 64
