[tachyon]
; Ignored when php-fpm starts unprivileged (as it does at runtime); required
; only so the root-run `php-fpm84 -t` in the Dockerfile accepts the pool.
user = tachyon
group = tachyon

; Localhost only: nginx runs in a second container of the same pod.
listen = 127.0.0.1:9000

; A single-user webmail: a handful of workers is plenty, and ondemand keeps an
; idle pod small.
pm = ondemand
pm.max_children = 6
pm.process_idle_timeout = 30s
pm.max_requests = 200

ping.path = /fpm-ping
ping.response = pong

catch_workers_output = yes
decorate_workers_output = no
clear_env = yes
; gpg and gpg-agent are spawned from workers; give them a writable HOME. Tachyon
; passes --homedir explicitly, so this is only a fallback.
env[HOME] = /tmp
env[PATH] = /usr/local/bin:/usr/bin:/bin
env[TMPDIR] = /tmp
; nginx gives up at 600s (fastcgi_read_timeout); stop the worker too.
request_terminate_timeout = 600
